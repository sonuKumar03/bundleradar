name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify Release Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Verify release version consistency
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          ROOT_VERSION="$(cat VERSION | tr -d '[:space:]')"
          if [ "$TAG_VERSION" != "$ROOT_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match VERSION file $ROOT_VERSION" >&2
            exit 1
          fi

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests (Race & Count=1)
        run: go test -v -race -count=1 ./...

      - name: Verify Documentation & Schema Contracts
        run: go test -v . -run TestDocumentationContract -count=1

      - name: Build Binary
        run: |
          VERSION="$(cat VERSION | tr -d '[:space:]')"
          go build -ldflags="-X github.com/sonuKumar03/bundleradar/pkg/bundleradar.ToolVersion=${VERSION}" -o bundleradar .

      - name: Validate install.sh
        run: sh -n install.sh

      - name: Smoke Test Binary on Fixture
        run: |
          ./bundleradar scan testdata/minimal/stats.json -d testdata/minimal/browser
          ./bundleradar gate testdata/minimal/stats.json -d testdata/minimal/browser --max-initial 5MB

  publish:
    name: Build & Publish GitHub Release
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write # for cosign keyless signing via GitHub OIDC

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        uses: anchore/sbom-action@v0
        with:
          install-only: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_EXPERIMENTAL: "1"

      - name: Check if Highest SemVer
        id: check_latest
        run: |
          LATEST_TAG=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n 1)
          echo "Current tag: $GITHUB_REF_NAME, Highest tag: $LATEST_TAG"
          if [ "$GITHUB_REF_NAME" = "$LATEST_TAG" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
            gh release edit "$GITHUB_REF_NAME" --latest
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Moving Major Action Tag
        if: steps.check_latest.outputs.is_latest == 'true'
        run: |
          # Extract major version number (e.g. "0" from "v0.4.0", or "1" from "v1.0.0")
          TAG="${GITHUB_REF_NAME}"
          MAJOR="${TAG%%.*}"
          echo "Updating moving major tag $MAJOR to point to $TAG..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "$MAJOR" -m "Update $MAJOR to point to $TAG"
          git push origin "$MAJOR" --force