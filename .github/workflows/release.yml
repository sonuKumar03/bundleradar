name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify Release Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Verify release version consistency
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          ROOT_VERSION="$(cat VERSION | tr -d '[:space:]')"
          if [ "$TAG_VERSION" != "$ROOT_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match VERSION file $ROOT_VERSION" >&2
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests (Race & Count=1)
        run: go test -v -race -count=1 ./...

      - name: Verify Documentation & Schema Contracts
        run: go test -v . -run TestDocumentationContract -count=1

      - name: Build Binary
        run: |
          VERSION="$(cat VERSION | tr -d '[:space:]')"
          go build -ldflags="-X github.com/sonuKumar03/bundleradar/pkg/bundleradar.ToolVersion=${VERSION}" -o bundleradar .

      - name: Validate install.sh
        run: sh -n install.sh

      - name: Smoke Test Binary on Fixture
        run: |
          ./bundleradar scan testdata/minimal/stats.json -d testdata/minimal/browser
          ./bundleradar gate testdata/minimal/stats.json -d testdata/minimal/browser --max-initial 5MB

  publish:
    name: Build & Publish GitHub Release
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Build Multi-Arch Binaries
        id: build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIST_DIR="dist-release"
          mkdir -p "$DIST_DIR"

          TARGETS=(
            "darwin/amd64/bundleradar_${VERSION}_darwin_amd64.tar.gz"
            "darwin/arm64/bundleradar_${VERSION}_darwin_arm64.tar.gz"
            "linux/amd64/bundleradar_${VERSION}_linux_amd64.tar.gz"
            "linux/arm64/bundleradar_${VERSION}_linux_arm64.tar.gz"
            "windows/amd64/bundleradar_${VERSION}_windows_amd64.zip"
          )

          for TARGET in "${TARGETS[@]}"; do
            IFS='/' read -r GOOS GOARCH ARCHIVE_NAME <<< "$TARGET"
            echo "Building $GOOS/$GOARCH -> $ARCHIVE_NAME..."

            TMP_BUILD="build-${GOOS}-${GOARCH}"
            mkdir -p "$TMP_BUILD"

            EXE_NAME="bundleradar"
            if [ "$GOOS" = "windows" ]; then
              EXE_NAME="bundleradar.exe"
            fi

            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="-s -w -X github.com/sonuKumar03/bundleradar/pkg/bundleradar.ToolVersion=${VERSION}" -o "${TMP_BUILD}/${EXE_NAME}" .
            cp README.md LICENSE "${TMP_BUILD}/"

            if [ "$GOOS" = "windows" ]; then
              (cd "$TMP_BUILD" && zip -r "../${DIST_DIR}/${ARCHIVE_NAME}" .)
            else
              tar -czvf "${DIST_DIR}/${ARCHIVE_NAME}" -C "$TMP_BUILD" .
            fi

            rm -rf "$TMP_BUILD"
          done

          # Compute SHA256 checksums
          cd "$DIST_DIR"
          sha256sum * > checksums.txt
          cd ..

      - name: Check if Highest SemVer
        id: check_latest
        run: |
          LATEST_TAG=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n 1)
          echo "Current tag: $GITHUB_REF_NAME, Highest tag: $LATEST_TAG"
          if [ "$GITHUB_REF_NAME" = "$LATEST_TAG" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*
          generate_release_notes: true
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: ${{ steps.check_latest.outputs.is_latest }}

      - name: Update Moving Major Action Tag
        if: steps.check_latest.outputs.is_latest == 'true'
        run: |
          # Extract major version number (e.g. "0" from "v0.4.0", or "1" from "v1.0.0")
          TAG="${GITHUB_REF_NAME}"
          MAJOR="${TAG%%.*}"
          echo "Updating moving major tag $MAJOR to point to $TAG..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "$MAJOR" -m "Update $MAJOR to point to $TAG"
          git push origin "$MAJOR" --force

