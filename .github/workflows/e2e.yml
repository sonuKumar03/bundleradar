name: E2E Integration

on:
  push:
    branches: [ master ]
    paths:
      - 'testdata/nx-workspace/**'
      - 'testdata/vite-app/**'
      - 'testdata/webpack-app/**'
      - 'testdata/minimal/**'
      - 'cmd/**'
      - 'internal/**'
      - 'test/**'
      - 'go.mod'
      - 'go.sum'
      - 'action.yml'
      - '.github/workflows/**'
      - '.goreleaser.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'testdata/nx-workspace/**'
      - 'testdata/vite-app/**'
      - 'testdata/webpack-app/**'
      - 'testdata/minimal/**'
      - 'cmd/**'
      - 'internal/**'
      - 'test/**'
      - 'go.mod'
      - 'go.sum'
      - 'action.yml'
      - '.github/workflows/**'
      - '.goreleaser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: Nx Workspace E2E & Real Build Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare a smaller total-size baseline
        run: |
          sed 's/"bytes": 1024/"bytes": 1000/' testdata/minimal/stats.json > testdata/minimal/baseline-stats.json

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            testdata/nx-workspace/package-lock.json
            testdata/vite-app/package-lock.json
            testdata/webpack-app/package-lock.json

      - name: Install Nx workspace dependencies
        working-directory: testdata/nx-workspace
        run: npm ci

      - name: Build Nx applications with stats.json
        working-directory: testdata/nx-workspace
        run: npm run build

      - name: Install and build real Vite fixture
        working-directory: testdata/vite-app
        run: |
          npm ci
          npm run build

      - name: Install and build real webpack fixture
        working-directory: testdata/webpack-app
        run: |
          npm ci
          npm run build

      - name: Run Full Integration Tests with Real Builds (Nx, Vite, webpack)
        env:
          BUNDLECHECK_REQUIRE_E2E: "1"
        run: go test -v -count=1 ./...

      - name: Build bundleradar CLI
        shell: bash
        run: |
          VERSION="$(cat VERSION | tr -d '[:space:]')"
          go build -ldflags="-X github.com/sonuKumar03/bundleradar/pkg/bundleradar.ToolVersion=${VERSION}" -o bundleradar .

      - name: Verify bundleradar CLI on real Nx workspace
        run: |
          ./bundleradar workspace list --root testdata/nx-workspace
          ./bundleradar workspace scan --root testdata/nx-workspace
          ./bundleradar scan testdata/nx-workspace/dist/apps/portal/stats.json
          ./bundleradar scan testdata/nx-workspace/dist/apps/admin-dashboard/stats.json
          ./bundleradar gate testdata/nx-workspace/dist/apps/portal/stats.json --max-initial 10MB

      - name: Verify worktree baseline comparison on committed fixture
        run: |
          ./bundleradar diff testdata/minimal/stats.json --against master --no-build
          ./bundleradar gate testdata/minimal/stats.json --against master --no-build --max-initial-delta 10MB

      - name: Verify bundleradar CLI on real Vite and webpack builds
        run: |
          ./bundleradar scan testdata/vite-app/dist/.vite/manifest.json -d testdata/vite-app/dist
          ./bundleradar scan testdata/webpack-app/dist/stats.json
          ./bundleradar gate testdata/webpack-app/dist/stats.json --max-initial 10MB

      - name: Publish Bundlecheck Report to GitHub Step Summary
        run: |
          echo "# 📊 BundleRadar Real Nx Workspace Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ./bundleradar workspace scan --root testdata/nx-workspace -f markdown >> $GITHUB_STEP_SUMMARY

  action-consumer:
    name: Action Consumer & Regression Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test Action - Success Case (Fixture Minimal)
        id: test-success
        uses: ./
        with:
          working-directory: testdata/minimal
          stats: stats.json
          dist: browser
          output: action-report.md
          json-output: action-audit.json
          max-initial: 5MB
          max-lazy: 5MB
          max-total-delta: 0B
          baseline: stats.json
          # Fixture repo has no package.json; skip the auto worktree base-ref
          # build by comparing directly against the committed fixture stats.
          build-cmd: 'true'

      - name: Assert Action Outputs & Report Files
        run: |
          test -f testdata/minimal/action-report.md || (echo "Missing report file" && exit 1)
          test -f testdata/minimal/action-audit.json || (echo "Missing json audit file" && exit 1)
          if [ "${{ steps.test-success.outputs.initial-bytes }}" -le 0 ]; then
            echo "Expected positive initial-bytes output, got: ${{ steps.test-success.outputs.initial-bytes }}"
            exit 1
          fi
          if [ "${{ steps.test-success.outputs.total-bytes }}" -le 0 ]; then
            echo "Expected positive total-bytes output, got: ${{ steps.test-success.outputs.total-bytes }}"
            exit 1
          fi

      - name: Test Action - Success Case with Entry (Fixture Minimal)
        id: test-entry
        uses: ./
        with:
          working-directory: testdata/minimal
          stats: stats.json
          dist: browser
          entry: 'src/main.ts'
          output: entry-report.md
          json-output: entry-audit.json
          max-initial: 5MB
          build-cmd: 'true'

      - name: Assert Action Outputs & Report Files with Entry
        run: |
          test -f testdata/minimal/entry-report.md || (echo "Missing entry report file" && exit 1)
          test -f testdata/minimal/entry-audit.json || (echo "Missing entry json audit file" && exit 1)
          if [ "${{ steps.test-entry.outputs.initial-bytes }}" -le 0 ]; then
            echo "Expected positive initial-bytes output, got: ${{ steps.test-entry.outputs.initial-bytes }}"
            exit 1
          fi
          if [ "${{ steps.test-entry.outputs.total-bytes }}" -le 0 ]; then
            echo "Expected positive total-bytes output, got: ${{ steps.test-entry.outputs.total-bytes }}"
            exit 1
          fi

      - name: Test Action - Upload Artifact Baseline (Fixture Minimal)
        id: test-artifact-baseline
        uses: ./
        with:
          working-directory: testdata/minimal
          stats: stats.json
          dist: browser
          upload-artifact-baseline: 'true'
          artifact-name: 'fixture-test-baseline'
          max-initial: 5MB
          build-cmd: 'true'

      - name: Assert Baseline Upload File Created
        run: |
          test -f testdata/minimal/.bundleradar/upload/fixture-test-baseline/baseline.json || (echo "Missing baseline upload json" && exit 1)

      - name: Test Action - Invalid Input Failure Case
        id: test-invalid-input
        continue-on-error: true
        uses: ./
        with:
          working-directory: testdata/minimal
          stats: nonexistent-stats.json
          output: invalid-report.md

      - name: Assert Invalid Input Failed
        run: |
          if [ "${{ steps.test-invalid-input.outcome }}" != "failure" ]; then
            echo "Expected invalid input step to fail, but got: ${{ steps.test-invalid-input.outcome }}"
            exit 1
          fi

      - name: Test Action - Budget Violation Failure Case
        id: test-budget-failure
        continue-on-error: true
        uses: ./
        with:
          working-directory: testdata/minimal
          stats: stats.json
          dist: browser
          max-initial: 100B
          output: budget-failure-report.md
          build-cmd: 'true'

      - name: Assert Budget Violation Step Failed
        run: |
          if [ "${{ steps.test-budget-failure.outcome }}" != "failure" ]; then
            echo "Expected budget breach step to fail, but got: ${{ steps.test-budget-failure.outcome }}"
            exit 1
          fi
          test -f testdata/minimal/budget-failure-report.md || (echo "Expected budget failure report to be generated" && exit 1)
          echo "BUDGET_FAILED=false" >> "$GITHUB_ENV"

      - name: Test Action - Lazy Budget Violation Failure
        id: test-lazy-budget
        continue-on-error: true
        uses: ./
        with:
          working-directory: testdata/lazy-import
          stats: stats.json
          baseline: stats.json
          max-lazy: 1B
          output: lazy-budget-failure-report.md

      - name: Assert Lazy Budget Violation Failed
        run: |
          if [ "${{ steps.test-lazy-budget.outcome }}" != "failure" ]; then
            echo "Expected lazy budget breach to fail, but got: ${{ steps.test-lazy-budget.outcome }}"
            exit 1
          fi
          echo "BUDGET_FAILED=false" >> "$GITHUB_ENV"

      - name: Test Action - Total Delta Budget Violation Failure
        id: test-total-delta-budget
        continue-on-error: true
        uses: ./
        with:
          working-directory: testdata/minimal
          stats: stats.json
          baseline: baseline-stats.json
          max-total-delta: 0B
          output: total-delta-budget-failure-report.md

      - name: Assert Total Delta Budget Violation Failed
        run: |
          if [ "${{ steps.test-total-delta-budget.outcome }}" != "failure" ]; then
            echo "Expected total delta budget breach to fail, but got: ${{ steps.test-total-delta-budget.outcome }}"
            exit 1
          fi
          echo "BUDGET_FAILED=false" >> "$GITHUB_ENV"

      - name: Prepare Action stats auto-detection fixtures
        run: |
          mkdir -p testdata/minimal/autodetect/app testdata/minimal/autodetect/other
          cp testdata/minimal/stats.json testdata/minimal/autodetect/app/stats.json
          cp testdata/minimal/stats.json testdata/minimal/autodetect/other/stats.json

      - name: Test Action - Auto-detect stats for selected project
        id: test-auto-stats
        uses: ./
        with:
          working-directory: testdata/minimal/autodetect
          project: app
          baseline: app/stats.json
          build-cmd: 'true'
          output: auto-stats-report.md
          json-output: auto-stats-audit.json

      - name: Assert Action selected project stats
        run: |
          test -f testdata/minimal/autodetect/auto-stats-report.md
          test -f testdata/minimal/autodetect/auto-stats-audit.json
          test "${{ steps.test-auto-stats.outputs.initial-bytes }}" -gt 0

      - name: Test Action - Reject ambiguous automatic stats
        id: test-ambiguous-auto-stats
        continue-on-error: true
        uses: ./
        with:
          working-directory: testdata/minimal/autodetect
          build-cmd: 'true'
          output: ambiguous-auto-stats-report.md

      - name: Assert Action rejected ambiguous stats
        run: |
          if [ "${{ steps.test-ambiguous-auto-stats.outcome }}" != "failure" ]; then
            echo "Expected ambiguous stats selection to fail, but got: ${{ steps.test-ambiguous-auto-stats.outcome }}"
            exit 1
          fi

      - name: Prepare config-only Action budget
        run: |
          printf 'budgets:\n  initial_js_max: 100B\n' > testdata/minimal/.bundleradar.yml

      - name: Test Action - Config-Only Budget Violation
        id: test-config-budget
        continue-on-error: true
        uses: ./
        with:
          working-directory: testdata/minimal
          stats: stats.json
          output: config-budget-failure-report.md
          build-cmd: 'true'

      - name: Assert Config-Only Budget Violation Failed
        run: |
          if [ "${{ steps.test-config-budget.outcome }}" != "failure" ]; then
            echo "Expected config-only budget breach to fail, but got: ${{ steps.test-config-budget.outcome }}"
            exit 1
          fi
          rm testdata/minimal/.bundleradar.yml
