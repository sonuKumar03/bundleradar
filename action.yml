name: 'BundleRadar - Angular Bundle Analyzer & PR Reporter'
description: 'Analyze Angular bundle sizes, estimate Gzip wire transfers, generate PR reports, and enforce size budgets in CI.'
author: 'Sonu Kumar'
branding:
  icon: 'package'
  color: 'blue'

inputs:
  working-directory:
    description: 'Working directory to run bundleradar in'
    required: false
    default: '.'
  stats:
    description: 'Path to Angular stats.json (auto-detected if omitted)'
    required: false
    default: ''
  dist:
    description: 'Path to emitted browser dist with index.html (auto-detected if omitted)'
    required: false
    default: ''
  project:
    description: 'Project name for multi-project workspaces when auto-detecting'
    required: false
    default: ''
  projects:
    description: 'Comma-separated project names to track in CI (e.g. portal,admin-dashboard)'
    required: false
    default: ''
  apps:
    description: 'Explicit app targets in format "name=stats[:dist]" separated by commas or spaces'
    required: false
    default: ''
  entry:
    description: 'Select an entrypoint by source path or exact emitted chunk name (e.g. src/main.ts or main.js); glob patterns are not supported.'
    required: false
    default: ''
  format:
    description: 'Report format: markdown, json, or text'
    required: false
    default: 'markdown'
  output:
    description: 'File path to write report output (e.g. pr-comment.md)'
    required: false
    default: 'bundle-report.md'
  json-output:
    description: 'Optional file path to write full JSON audit report'
    required: false
    default: ''
  gzip:
    description: 'Include Gzip wire transfer estimation'
    required: false
    default: 'true'
  suggest:
    description: 'Include automated optimization suggestions'
    required: false
    default: 'true'
  max-initial:
    description: 'Maximum allowed initial JS size (e.g. 250KB, 1MB)'
    required: false
    default: ''
  max-lazy:
    description: 'Maximum allowed lazy JS size (e.g. 500KB)'
    required: false
    default: ''
  max-total:
    description: 'Maximum allowed total JS size (e.g. 1.5MB)'
    required: false
    default: ''
  max-css:
    description: 'Maximum allowed total CSS size (e.g. 100KB, 1MB)'
    required: false
    default: ''
  max-assets:
    description: 'Maximum allowed total asset size for images, fonts and media (e.g. 2MB)'
    required: false
    default: ''
  baseline:
    description: 'Path to baseline summary JSON for regression checks'
    required: false
    default: ''
  base-ref:
    description: 'Git base ref (e.g. main, master, or github.base_ref) for automatic worktree comparison'
    required: false
    default: ''
  build-cmd:
    description: 'Build command to run when building base-ref in worktree (defaults to "npm run build")'
    required: false
    default: ''
  max-initial-delta:
    description: 'Maximum allowed increase in initial JS vs baseline (e.g. 0B, 10KB)'
    required: false
    default: ''
  max-total-delta:
    description: 'Maximum allowed increase in total JS vs baseline'
    required: false
    default: ''
  drift-threshold:
    description: 'Byte threshold under which individual regression findings are collapsed as micro-drift (e.g. 1KB, 500B)'
    required: false
    default: '1KB'
  artifact-baseline:
    description: 'Attempt to restore baseline summary JSON from a GitHub Actions workflow artifact on base-ref'
    required: false
    default: 'false'
  artifact-name:
    description: 'Name of the baseline workflow artifact (defaults to bundleradar-baseline or bundleradar-baseline-<project>)'
    required: false
    default: ''
  upload-artifact-baseline:
    description: 'Save current bundle summary and upload as a baseline workflow artifact'
    required: false
    default: 'false'
  github-token:
    description: 'GitHub token for downloading baseline artifacts and posting PR comments'
    required: false
    default: ${{ github.token }}
  post-comment:
    description: 'Automatically post or update PR summary comment'
    required: false
    default: 'false'

outputs:
  initial-bytes:
    description: 'Initial bundle size in raw bytes'
    value: ${{ steps.run-bundleradar.outputs.initial_bytes }}
  lazy-bytes:
    description: 'Lazy chunks size in raw bytes'
    value: ${{ steps.run-bundleradar.outputs.lazy_bytes }}
  total-bytes:
    description: 'Total JavaScript size in raw bytes'
    value: ${{ steps.run-bundleradar.outputs.total_bytes }}
  report-path:
    description: 'Path where the bundle report was written'
    value: ${{ inputs.output }}
  comparison-status:
    description: 'Comparison status: completed or unavailable'
    value: ${{ steps.run-bundleradar.outputs.comparison_status }}
  comparison-message:
    description: 'Detailed explanation of comparison status'
    value: ${{ steps.run-bundleradar.outputs.comparison_message }}

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 'stable'

    - name: Build & Install bundleradar
      shell: bash
      run: |
        if ! command -v bundleradar >/dev/null 2>&1; then
          if [ -f "${{ github.action_path }}/main.go" ]; then
            echo "Building bundleradar from local action path: ${{ github.action_path }}"
            cd "${{ github.action_path }}" && (go build -o /usr/local/bin/bundleradar . 2>/dev/null || (mkdir -p "$HOME/.local/bin" && go build -o "$HOME/.local/bin/bundleradar" . && echo "$HOME/.local/bin" >> $GITHUB_PATH))
          else
            echo "Installing precompiled bundleradar binary..."
            curl -fsSL https://raw.githubusercontent.com/sonuKumar03/bundleradar/master/install.sh | sh
            echo "$HOME/.local/bin" >> $GITHUB_PATH
            echo "/usr/local/bin" >> $GITHUB_PATH
          fi
        fi

    - name: Run bundleradar Analysis & Budgets
      id: run-bundleradar
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_STATS: ${{ inputs.stats }}
        INPUT_DIST: ${{ inputs.dist }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_PROJECTS: ${{ inputs.projects }}
        INPUT_APPS: ${{ inputs.apps }}
        INPUT_ENTRY: ${{ inputs.entry }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        INPUT_BUILD_CMD: ${{ inputs.build-cmd }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_JSON_OUTPUT: ${{ inputs.json-output }}
        INPUT_GZIP: ${{ inputs.gzip }}
        INPUT_SUGGEST: ${{ inputs.suggest }}
        INPUT_MAX_INITIAL: ${{ inputs.max-initial }}
        INPUT_MAX_LAZY: ${{ inputs.max-lazy }}
        INPUT_MAX_TOTAL: ${{ inputs.max-total }}
        INPUT_MAX_CSS: ${{ inputs.max-css }}
        INPUT_MAX_ASSETS: ${{ inputs.max-assets }}
        INPUT_MAX_INITIAL_DELTA: ${{ inputs.max-initial-delta }}
        INPUT_MAX_TOTAL_DELTA: ${{ inputs.max-total-delta }}
        INPUT_DRIFT_THRESHOLD: ${{ inputs.drift-threshold }}
        INPUT_ARTIFACT_BASELINE: ${{ inputs.artifact-baseline }}
        INPUT_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        INPUT_UPLOAD_ARTIFACT_BASELINE: ${{ inputs.upload-artifact-baseline }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_BASE_REF: ${{ github.base_ref }}
      run: |
        set -eo pipefail

        # 0. Multi-application tracking mode
        if [ -n "$INPUT_PROJECTS" ] || [ -n "$INPUT_APPS" ]; then
          echo "Running bundleradar in explicit multi-application mode..."
          if [ -n "$INPUT_BASELINE" ]; then
            echo "::error::The baseline input is not supported in multi-app mode; use base-ref so each app is compared independently."
            exit 2
          fi
          if [ "$INPUT_ARTIFACT_BASELINE" = "true" ] || [ "$INPUT_UPLOAD_ARTIFACT_BASELINE" = "true" ]; then
            echo "::error::Artifact baseline restore and upload are not supported in multi-app mode."
            exit 2
          fi
          MULTI_BASE_REF="$INPUT_BASE_REF"
          if [ -z "$MULTI_BASE_REF" ] && [ "$EVENT_NAME" = "pull_request" ]; then
            MULTI_BASE_REF="$EVENT_BASE_REF"
          fi
          WS_FLAGS=()
          if [ -n "$INPUT_APPS" ]; then
            for app in ${INPUT_APPS//,/ }; do
              WS_FLAGS+=("--app" "$app")
            done
          fi
          if [ -n "$INPUT_PROJECTS" ]; then
            DISCOVERED=$(bundleradar workspace scan -f json)
            SELECTED_SPECS=$(node -e '
              const data = JSON.parse(process.argv[1]);
              for (const name of process.argv[2].split(/[,\s]+/).filter(Boolean)) {
                const target = data.targets.find(t => t.name === name);
                if (!target) { console.error(`Project ${name} was not found or could not be scanned`); process.exit(1); }
                console.log(`${name}=${target.statsPath}${target.distPath ? `:${target.distPath}` : ""}`);
              }
            ' "$DISCOVERED" "$INPUT_PROJECTS")
            while IFS= read -r spec; do
              [ -n "$spec" ] && WS_FLAGS+=("--app" "$spec")
            done <<< "$SELECTED_SPECS"
          fi

          REPORT_FLAGS=("${WS_FLAGS[@]}" "-f" "$INPUT_FORMAT")
          if [ -n "$INPUT_OUTPUT" ]; then
            REPORT_FLAGS+=("-o" "$INPUT_OUTPUT")
          fi

          bundleradar workspace scan "${REPORT_FLAGS[@]}"

          # Append to Job Summary if output file exists and GITHUB_STEP_SUMMARY is set
          if [ -n "$GITHUB_STEP_SUMMARY" ] && [ -n "$INPUT_OUTPUT" ] && [ -f "$INPUT_OUTPUT" ]; then
            cat "$INPUT_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Extract structured metrics via JSON
          JSON_OUT=$(bundleradar workspace scan "${WS_FLAGS[@]}" -f json)
          if [ -n "$INPUT_JSON_OUTPUT" ]; then
            echo "$JSON_OUT" > "$INPUT_JSON_OUTPUT"
          fi

          # Parse multi-app metrics strictly
          PARSED_METRICS=$(node -e '
            const data = process.argv[1];
            try {
              const parsed = JSON.parse(data);
              if (parsed.targets.length !== Number(process.argv[2])) throw new Error("one or more selected applications could not be scanned");
              const initial = parsed.totalInitialBytes || 0;
              const lazy = parsed.totalAsyncBytes || 0;
              const total = parsed.totalBytes || (initial + lazy);
              console.log([initial, lazy, total].join(" "));
            } catch (e) {
              console.error("Failed to parse bundleradar workspace JSON output:", e.message);
              process.exit(1);
            }
          ' "$JSON_OUT" "$((${#WS_FLAGS[@]} / 2))")

          read -r INITIAL LAZY TOTAL <<< "$PARSED_METRICS"

          echo "initial_bytes=$INITIAL" >> $GITHUB_OUTPUT
          echo "lazy_bytes=$LAZY" >> $GITHUB_OUTPUT
          echo "total_bytes=$TOTAL" >> $GITHUB_OUTPUT
          if [ -n "$MULTI_BASE_REF" ]; then
            echo "comparison_status=completed" >> "$GITHUB_OUTPUT"
            echo "comparison_message=Compared each selected application against base ref '$MULTI_BASE_REF'; workspace report contains current scans" >> "$GITHUB_OUTPUT"
          else
            echo "comparison_status=unavailable" >> "$GITHUB_OUTPUT"
            echo "comparison_message=No baseline configured; multi-app workspace report contains current scans only" >> "$GITHUB_OUTPUT"
          fi

          TARGET_STATS=$(node -e 'console.log(JSON.parse(process.argv[1]).targets.map(t => `${t.statsPath}\t${t.distPath || ""}`).join("\n"))' "$JSON_OUT")
          while IFS=$'\t' read -r stats dist; do
            [ -z "$stats" ] && continue
            GATE_FLAGS=("$stats")
            if [ -n "$dist" ]; then GATE_FLAGS+=("--dist" "$dist"); fi
            if [ -n "$INPUT_MAX_INITIAL" ]; then GATE_FLAGS+=("--max-initial" "$INPUT_MAX_INITIAL"); fi
            if [ -n "$INPUT_MAX_LAZY" ]; then GATE_FLAGS+=("--max-lazy" "$INPUT_MAX_LAZY"); fi
            if [ -n "$INPUT_MAX_TOTAL" ]; then GATE_FLAGS+=("--max-total" "$INPUT_MAX_TOTAL"); fi
            if [ -n "$INPUT_MAX_CSS" ]; then GATE_FLAGS+=("--max-css" "$INPUT_MAX_CSS"); fi
            if [ -n "$INPUT_MAX_ASSETS" ]; then GATE_FLAGS+=("--max-assets" "$INPUT_MAX_ASSETS"); fi
            if [ -n "$INPUT_MAX_INITIAL_DELTA" ]; then GATE_FLAGS+=("--max-initial-delta" "$INPUT_MAX_INITIAL_DELTA"); fi
            if [ -n "$INPUT_MAX_TOTAL_DELTA" ]; then GATE_FLAGS+=("--max-total-delta" "$INPUT_MAX_TOTAL_DELTA"); fi
            if [ -n "$INPUT_BASELINE" ]; then GATE_FLAGS+=("--against" "$INPUT_BASELINE"); fi
            if [ -n "$MULTI_BASE_REF" ]; then GATE_FLAGS+=("--against" "$MULTI_BASE_REF"); fi
            if [ -n "$INPUT_BUILD_CMD" ]; then GATE_FLAGS+=("--build-cmd" "$INPUT_BUILD_CMD"); fi
            if ! bundleradar gate "${GATE_FLAGS[@]}"; then
              echo "BUDGET_FAILED=true" >> "$GITHUB_ENV"
            fi
          done <<< "$TARGET_STATS"

          exit 0
        fi

        if [ -z "$INPUT_STATS" ]; then
          STATS_CANDIDATES=()
          while IFS= read -r -d '' stats; do STATS_CANDIDATES+=("$stats"); done < <(find . -type d \( -name .git -o -name node_modules \) -prune -o -type f -name stats.json -print0)
          INPUT_STATS=$(node -e '
            const path = require("path");
            const candidates = process.argv.slice(1, -1);
            const project = process.argv.at(-1);
            const matches = project
              ? candidates.filter(file => path.relative(process.cwd(), file).split(path.sep).includes(project))
              : candidates;
            if (matches.length !== 1) {
              console.error(matches.length === 0
                ? `Unable to auto-detect stats.json${project ? ` for project ${project}` : ""}; set the stats input.`
                : `Found ${matches.length} stats.json files${project ? ` for project ${project}` : ""}; set the project or stats input.`);
              process.exit(2);
            }
            console.log(matches[0]);
          ' "${STATS_CANDIDATES[@]}" "$INPUT_PROJECT")
          echo "Auto-detected stats file: $INPUT_STATS"
        fi

        ARGS=()
        if [ -n "$INPUT_DIST" ]; then ARGS+=("-d" "$INPUT_DIST"); fi
        if [ -n "$INPUT_ENTRY" ]; then ARGS+=("--entry" "$INPUT_ENTRY"); fi

        BASELINE_TARGET="$INPUT_BASELINE"
        COMPARISON_STATUS="unavailable"
        COMPARISON_MESSAGE="No baseline file or pull request base ref available"

        # Determine target base ref
        TARGET_BASE_REF="$INPUT_BASE_REF"
        if [ -z "$TARGET_BASE_REF" ] && [ -z "$BASELINE_TARGET" ] && [ "$EVENT_NAME" = "pull_request" ]; then
          TARGET_BASE_REF="$EVENT_BASE_REF"
        fi

        # Determine effective artifact name (defaulting with app/project namespacing if project is set)
        EFFECTIVE_ARTIFACT_NAME="$INPUT_ARTIFACT_NAME"
        if [ -z "$EFFECTIVE_ARTIFACT_NAME" ]; then
          if [ -n "$INPUT_PROJECT" ]; then
            EFFECTIVE_ARTIFACT_NAME="bundleradar-baseline-$INPUT_PROJECT"
          else
            EFFECTIVE_ARTIFACT_NAME="bundleradar-baseline"
          fi
        fi

        # Attempt to retrieve baseline artifact if requested
        if [ "$INPUT_ARTIFACT_BASELINE" = "true" ] && [ -z "$BASELINE_TARGET" ]; then
          echo "Attempting to retrieve baseline artifact '$EFFECTIVE_ARTIFACT_NAME'..."
          ARTIFACT_DIR=".bundleradar/artifacts/$EFFECTIVE_ARTIFACT_NAME"
          mkdir -p "$ARTIFACT_DIR"

          GH_REPO_ARGS=()
          if [ -n "$GITHUB_REPOSITORY" ]; then
            GH_REPO_ARGS+=("--repo" "$GITHUB_REPOSITORY")
          fi

          DOWNLOAD_SUCCESS=false
          export GH_TOKEN="${INPUT_GITHUB_TOKEN:-$GITHUB_TOKEN}"

          BRANCH_TARGET="${TARGET_BASE_REF#origin/}"
          BRANCH_TARGET="${BRANCH_TARGET#refs/heads/}"
          BASELINE_RUNS=""
          if [ -n "$BRANCH_TARGET" ]; then
            BASELINE_RUNS=$(gh run list --branch "$BRANCH_TARGET" --status success --limit 100 --json databaseId,headBranch,headSha --jq '.[] | [.databaseId, .headBranch, .headSha] | @tsv' "${GH_REPO_ARGS[@]}" 2>/dev/null || true)
          fi

          SELECTED_RUN_ID=""
          SELECTED_RUN_SHA=""
          while IFS=$'\t' read -r RUN_ID RUN_BRANCH RUN_SHA; do
            [ -n "$RUN_ID" ] || continue
            [ "$RUN_BRANCH" = "$BRANCH_TARGET" ] || continue

            RUN_ARTIFACT_DIR="$ARTIFACT_DIR/$RUN_ID"
            mkdir -p "$RUN_ARTIFACT_DIR"
            FOUND_BASELINE=""
            GH_DOWNLOAD_ARGS=("--name" "$EFFECTIVE_ARTIFACT_NAME" "--dir" "$RUN_ARTIFACT_DIR" "${GH_REPO_ARGS[@]}")
            if gh run download "$RUN_ID" "${GH_DOWNLOAD_ARGS[@]}" 2>/dev/null; then
              FOUND_BASELINE=$(find "$RUN_ARTIFACT_DIR" -type f -name "*.json" 2>/dev/null | head -n 1)
              if [ -n "$FOUND_BASELINE" ] && [ -f "$FOUND_BASELINE" ]; then
                SELECTED_RUN_ID="$RUN_ID"
                SELECTED_RUN_SHA="$RUN_SHA"
                DOWNLOAD_SUCCESS=true
                break
              fi
            fi
          done <<< "$BASELINE_RUNS"

          if [ "$DOWNLOAD_SUCCESS" = "true" ]; then
            if [ -n "$FOUND_BASELINE" ] && [ -f "$FOUND_BASELINE" ]; then
              BASELINE_TARGET="$FOUND_BASELINE"
              COMPARISON_MESSAGE="Retrieved artifact '$EFFECTIVE_ARTIFACT_NAME' from run $SELECTED_RUN_ID ($BRANCH_TARGET@$SELECTED_RUN_SHA)"
              echo "  ✓ $COMPARISON_MESSAGE ($BASELINE_TARGET)"
            else
              echo "  ::warning::Artifact '$EFFECTIVE_ARTIFACT_NAME' downloaded but contained no valid JSON baseline file."
            fi
          else
            echo "  ::notice::No baseline artifact '$EFFECTIVE_ARTIFACT_NAME' found. Falling back to git ref or scan."
          fi
        fi

        if [ -n "$TARGET_BASE_REF" ] && [ -z "$BASELINE_TARGET" ]; then
          echo "Preparing base git ref: $TARGET_BASE_REF..."
          # Ensure base ref is fetched even in shallow checkouts
          if ! git rev-parse --verify "$TARGET_BASE_REF" >/dev/null 2>&1 && ! git rev-parse --verify "origin/$TARGET_BASE_REF" >/dev/null 2>&1; then
            echo "Fetching origin $TARGET_BASE_REF..."
            git fetch --no-tags --depth=1 origin "$TARGET_BASE_REF" 2>/dev/null || git fetch --no-tags origin "$TARGET_BASE_REF" 2>/dev/null || true
          fi

          if ! git rev-parse --verify "$TARGET_BASE_REF" >/dev/null 2>&1 && git rev-parse --verify "origin/$TARGET_BASE_REF" >/dev/null 2>&1; then
            TARGET_BASE_REF="origin/$TARGET_BASE_REF"
          fi

          BASELINE_TARGET="$TARGET_BASE_REF"
          COMPARISON_MESSAGE="Compared against base git ref '$TARGET_BASE_REF'"
        elif [ -n "$BASELINE_TARGET" ] && [ -f "$BASELINE_TARGET" ]; then
          if [ -n "$COMPARISON_MESSAGE" ]; then
            COMPARISON_MESSAGE="$COMPARISON_MESSAGE; compared against baseline file '$BASELINE_TARGET'"
          else
            COMPARISON_MESSAGE="Compared against baseline file '$BASELINE_TARGET'"
          fi
        fi

        # Generate report output
        if [ -n "$BASELINE_TARGET" ]; then
          DIFF_FLAGS=("$INPUT_STATS" "--against" "$BASELINE_TARGET" "-f" "$INPUT_FORMAT")
          if [ -n "$INPUT_DRIFT_THRESHOLD" ]; then DIFF_FLAGS+=("--drift-threshold" "$INPUT_DRIFT_THRESHOLD"); fi
          if [ -n "$INPUT_BUILD_CMD" ]; then DIFF_FLAGS+=("--build-cmd" "$INPUT_BUILD_CMD"); fi
          if [ -n "$INPUT_OUTPUT" ]; then DIFF_FLAGS+=("-o" "$INPUT_OUTPUT"); fi

          set +e
          bundleradar diff "${DIFF_FLAGS[@]}"
          DIFF_EXIT=$?
          set -e

          if [ $DIFF_EXIT -ne 0 ]; then
            COMPARISON_STATUS="unavailable"
            COMPARISON_MESSAGE="${COMPARISON_MESSAGE:+$COMPARISON_MESSAGE; }Baseline comparison failed (exit code $DIFF_EXIT)"
            if [ -n "$INPUT_OUTPUT" ] && [ -f "$INPUT_OUTPUT" ]; then
              echo "BUDGET_FAILED=true" >> "$GITHUB_ENV"
            else
              echo "comparison_status=$COMPARISON_STATUS" >> "$GITHUB_OUTPUT"
              echo "comparison_message=$COMPARISON_MESSAGE" >> "$GITHUB_OUTPUT"
              echo "::error::bundleradar diff execution failed (exit code $DIFF_EXIT)"
              exit $DIFF_EXIT
            fi
          else
            COMPARISON_STATUS="completed"
          fi
        else
          SCAN_FLAGS=("$INPUT_STATS" "${ARGS[@]}" "-f" "$INPUT_FORMAT")
          if [ -n "$INPUT_OUTPUT" ]; then SCAN_FLAGS+=("-o" "$INPUT_OUTPUT"); fi
          bundleradar scan "${SCAN_FLAGS[@]}"
        fi

        echo "comparison_status=$COMPARISON_STATUS" >> "$GITHUB_OUTPUT"
        echo "comparison_message=$COMPARISON_MESSAGE" >> "$GITHUB_OUTPUT"

        # Append to Job Summary if output file exists and GITHUB_STEP_SUMMARY is set
        if [ -n "$GITHUB_STEP_SUMMARY" ] && [ -n "$INPUT_OUTPUT" ] && [ -f "$INPUT_OUTPUT" ]; then
          cat "$INPUT_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
        fi

        # Extract structured metrics via JSON
        JSON_OUT=$(bundleradar scan "$INPUT_STATS" "${ARGS[@]}" -f json)
        if [ -n "$INPUT_JSON_OUTPUT" ]; then
          echo "$JSON_OUT" > "$INPUT_JSON_OUTPUT"
        fi

        if [ "$INPUT_UPLOAD_ARTIFACT_BASELINE" = "true" ]; then
          BASELINE_UPLOAD_DIR=".bundleradar/upload/$EFFECTIVE_ARTIFACT_NAME"
          mkdir -p "$BASELINE_UPLOAD_DIR"
          echo "$JSON_OUT" > "$BASELINE_UPLOAD_DIR/baseline.json"
          echo "UPLOAD_BASELINE_DIR=$BASELINE_UPLOAD_DIR" >> "$GITHUB_ENV"
          echo "EFFECTIVE_ARTIFACT_NAME=$EFFECTIVE_ARTIFACT_NAME" >> "$GITHUB_ENV"
        fi

        # Parse metrics strictly - fail if JSON is malformed or missing required summary fields
        PARSED_METRICS=$(node -e '
          const data = process.argv[1];
          try {
            const parsed = JSON.parse(data);
            let initial = 0;
            let lazy = 0;
            if (parsed.entrypoints) {
              for (const ep of Object.values(parsed.entrypoints)) {
                initial += ep.initialBytes || 0;
                lazy += ep.asyncBytes || 0;
              }
            }
            let total = 0;
            if (parsed.chunks && parsed.chunks.length > 0) {
              for (const c of parsed.chunks) {
                total += c.sizeBytes || 0;
              }
            } else {
              total = initial + lazy;
            }
            console.log([initial, lazy, total].join(" "));
          } catch (e) {
            console.error("Failed to parse bundleradar JSON scan output:", e.message);
            process.exit(1);
          }
        ' "$JSON_OUT")

        read -r INITIAL LAZY TOTAL <<< "$PARSED_METRICS"

        echo "initial_bytes=$INITIAL" >> $GITHUB_OUTPUT
        echo "lazy_bytes=$LAZY" >> $GITHUB_OUTPUT
        echo "total_bytes=$TOTAL" >> $GITHUB_OUTPUT

        # Enforce budget checks if any threshold is specified
        GATE_FLAGS=("$INPUT_STATS")
        if [ -n "$INPUT_DIST" ]; then GATE_FLAGS+=("-d" "$INPUT_DIST"); fi
        if [ -n "$INPUT_ENTRY" ]; then GATE_FLAGS+=("--entry" "$INPUT_ENTRY"); fi
        HAS_BUDGET=false
        if [ -n "$INPUT_MAX_INITIAL" ]; then GATE_FLAGS+=("--max-initial" "$INPUT_MAX_INITIAL"); HAS_BUDGET=true; fi
        if [ -n "$INPUT_MAX_LAZY" ]; then GATE_FLAGS+=("--max-lazy" "$INPUT_MAX_LAZY"); HAS_BUDGET=true; fi
        if [ -n "$INPUT_MAX_TOTAL" ]; then GATE_FLAGS+=("--max-total" "$INPUT_MAX_TOTAL"); HAS_BUDGET=true; fi
        if [ -n "$INPUT_MAX_CSS" ]; then GATE_FLAGS+=("--max-css" "$INPUT_MAX_CSS"); HAS_BUDGET=true; fi
        if [ -n "$INPUT_MAX_ASSETS" ]; then GATE_FLAGS+=("--max-assets" "$INPUT_MAX_ASSETS"); HAS_BUDGET=true; fi
        if [ -n "$BASELINE_TARGET" ]; then GATE_FLAGS+=("--against" "$BASELINE_TARGET"); HAS_BUDGET=true; fi
        if [ -n "$INPUT_MAX_INITIAL_DELTA" ]; then GATE_FLAGS+=("--max-initial-delta" "$INPUT_MAX_INITIAL_DELTA"); HAS_BUDGET=true; fi
        if [ -n "$INPUT_MAX_TOTAL_DELTA" ]; then GATE_FLAGS+=("--max-total-delta" "$INPUT_MAX_TOTAL_DELTA"); HAS_BUDGET=true; fi
        if [ -n "$INPUT_BUILD_CMD" ]; then GATE_FLAGS+=("--build-cmd" "$INPUT_BUILD_CMD"); fi
        if [ "$HAS_BUDGET" = "false" ]; then GATE_FLAGS+=("--detect-duplicate-pkgs=false"); fi

        echo "Enforcing bundle size budgets and configured policies with bundleradar gate..."
        if ! bundleradar gate "${GATE_FLAGS[@]}"; then
          echo "BUDGET_FAILED=true" >> "$GITHUB_ENV"
        fi

    - name: Post PR Comment
      if: always() && inputs.post-comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v9
      env:
        WORKING_DIR: ${{ inputs.working-directory }}
        OUTPUT_FILE: ${{ inputs.output }}
        PROJECT_NAME: ${{ inputs.project }}
        PROJECTS: ${{ inputs.projects }}
        APPS: ${{ inputs.apps }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const path = require('path');
          const repoRoot = path.resolve('.');
          const workingDir = process.env.WORKING_DIR || '.';
          const outputFile = process.env.OUTPUT_FILE || 'bundle-report.md';
          const reportPath = path.resolve(workingDir, outputFile);

          // Path traversal safety check: ensure reportPath stays inside workspace
          if (!reportPath.startsWith(repoRoot + path.sep) && reportPath !== repoRoot) {
            core.setFailed(`Security: report path '${reportPath}' is outside repository root '${repoRoot}'`);
            return;
          }

          if (fs.existsSync(reportPath)) {
            const reportContent = fs.readFileSync(reportPath, 'utf8');
            const isMultiApp = (process.env.PROJECTS || '').trim() !== '' || (process.env.APPS || '').trim() !== '' || reportContent.includes('<!-- bundleradar-multi-project-report -->');
            let headerTag = '<!-- bundleradar-comment -->';
            let fallbackHeaderTag = '<!-- bundleradar-report -->';
            let body = reportContent;

            if (isMultiApp) {
              headerTag = '<!-- bundleradar-multi-project-report -->';
              fallbackHeaderTag = '<!-- bundleradar-multi-project-report -->';
            } else {
              const rawProject = (process.env.PROJECT_NAME || '').trim();
              const project = rawProject ? rawProject.replace(/[^a-zA-Z0-9_-]/g, '-') : '';
              if (project) {
                headerTag = `<!-- bundleradar-comment-${project} -->`;
                fallbackHeaderTag = `<!-- bundleradar-report-${project} -->`;
                body = body.replace(/<!-- bundleradar-comment -->/g, headerTag)
                           .replace(/<!-- bundleradar-report -->/g, fallbackHeaderTag);

                if (!body.includes(`(\`${rawProject}\`)`)) {
                  body = body.replace(
                    /^(## [^—\n]+)( — [^\n]+)/m,
                    `$1 (\`${rawProject}\`)$2`
                  );
                }
              }
            }
            if (!body.includes(headerTag) && !body.includes(fallbackHeaderTag)) {
              body = `${headerTag}\n${body}`;
            }

            // Paginate through all comments to avoid duplicate bot comments on long PRs
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              }
            );

            const botComment = comments.find(c => c.body && (c.body.includes(headerTag) || c.body.includes(fallbackHeaderTag)));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
          }

    - name: Upload Baseline Artifact
      if: always() && inputs.upload-artifact-baseline == 'true' && env.UPLOAD_BASELINE_DIR != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.EFFECTIVE_ARTIFACT_NAME }}
        path: ${{ env.UPLOAD_BASELINE_DIR }}/baseline.json
        retention-days: 90
        if-no-files-found: warn

    - name: Finalize Budget Status
      shell: bash
      run: |
        if [ "${BUDGET_FAILED:-false}" = "true" ]; then
          echo "::error::BundleRadar size budget check failed."
          exit 1
        fi
